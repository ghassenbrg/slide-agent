name: Docs site

# Builds site/ (VitePress, sourced from docs/ and references/) and publishes it
# to GitHub Pages. The base path comes from configure-pages, so the same build
# works on ghassenbrg.github.io/slide-agent and, once it is set in
# Settings → Pages, on the custom domain slide-agent.ghassen.io.

on:
  push:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - references/**
      - .github/workflows/pages.yml
  pull_request:
    branches:
      - main
    paths:
      - site/**
      - docs/**
      - references/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Install
        working-directory: site
        run: npm ci
      - name: Build
        working-directory: site
        env:
          # "" with a custom domain, "/slide-agent" on github.io; "/" for pull requests.
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
