name: Release Slide Agent

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@latest
      - run: node scripts/verify-lockfile.mjs
      - run: npm ci
      - run: npm ci
        working-directory: extensions/vscode
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: extensions/vscode
      - run: npm run plugin:build
      - run: npm run release:verify
      - run: npm run verify
      - run: npm run verify:install
      - run: npm run release:artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: slide-agent-${{ github.ref_name }}
          path: release/*
      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NPM_TOKEN_FALLBACK: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN_FALLBACK" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN_FALLBACK"
          fi
          npm publish --access public
      - name: Publish VS Code extension
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            npx vsce publish --packagePath "slide-agent-vscode-${GITHUB_REF_NAME#v}.vsix" -p "$VSCE_PAT"
          else
            echo "VSCE_PAT is not configured; upload the packaged VSIX manually or use the publisher's identity-based pipeline."
          fi
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
