name: Slide Agent CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: node scripts/verify-lockfile.mjs
      - run: npm ci
      - run: npm ci
        working-directory: extensions/vscode
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: extensions/vscode
      - run: npm run audit:public
      - run: npm test
      - run: npm run build
      - run: npm run plugin:build
      - run: npm run plugin:validate
      - run: npm run release:verify
      - run: npm run verify:install
      - run: npm run package
        working-directory: extensions/vscode
      - run: node scripts/setup.mjs --target all --skip-cli
        env:
          SLIDE_AGENT_CODEX_SKILLS_DIR: ${{ runner.temp }}/slide-agent-skills/codex
          SLIDE_AGENT_COPILOT_SKILLS_DIR: ${{ runner.temp }}/slide-agent-skills/copilot
          SLIDE_AGENT_CLAUDE_SKILLS_DIR: ${{ runner.temp }}/slide-agent-skills/claude
          SLIDE_AGENT_GEMINI_SKILLS_DIR: ${{ runner.temp }}/slide-agent-skills/gemini
